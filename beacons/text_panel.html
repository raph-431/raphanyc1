<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }

        #three-canvas {
            display: block;
        }

        #help-panel {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: rgba(0, 0, 0, 0.7);
            color: #e3e3e3;
            padding: 10px;
            border-radius: 1px;
            border: 1px solid #e3e3e3;
            z-index: 100;
            font-family: Courier, monospace;
            opacity: 0;
            /* Start hidden */
        }
    </style>
</head>

<body>
    <canvas id="three-canvas"></canvas>

    <!-- Floating help panel -->
    <div id="help-panel">
        <!-- <h3>Help</h3> -->
        <!-- <ul> -->
            W: Move forward<br>
            A: Move left
            <!-- <li>W: Move forward</li>
            <li>A: Move left</li>
            <li>S: Move backward</li>
            <li>D: Move right</li> -->
        <!-- </ul> -->
    </div>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Basic Three.js setup
        const canvas = document.getElementById('three-canvas');
        const renderer = new THREE.WebGLRenderer({ canvas });
        renderer.setSize(window.innerWidth, window.innerHeight);

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;

        // Add a simple cube for context
        const geometry = new THREE.BoxGeometry();
        const material = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
        const cube = new THREE.Mesh(geometry, material);
        scene.add(cube);

        function animate() {
            requestAnimationFrame(animate);
            cube.rotation.x += 0.01;
            cube.rotation.y += 0.01;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        });

        // JavaScript functions to control the flicker effect
        function flickerIn(panel, initialDelay = 100, cycles = 12, speedUpFactor = 0.8, callback) {
            let count = 0;
            let delay = initialDelay;
            panel.style.opacity = "0"; // Ensure starting hidden

            function toggle() {
                if (count < cycles) {
                    panel.style.opacity = panel.style.opacity === "1" ? "0" : "1";
                    count++;
                    delay *= speedUpFactor;
                    setTimeout(toggle, delay);
                } else {
                    panel.style.opacity = "1"; // End fully visible
                    if (callback) callback();
                }
            }
            toggle();
        }

        function flickerOut(panel, initialDelay = 500, cycles = 8, speedUpFactor = 0.8, callback) {
            let count = 0;
            let delay = initialDelay;
            panel.style.opacity = "1"; // Ensure starting visible

            function toggle() {
                if (count < cycles) {
                    panel.style.opacity = panel.style.opacity === "1" ? "0" : "1";
                    count++;
                    delay *= speedUpFactor;
                    setTimeout(toggle, delay);
                } else {
                    panel.style.opacity = "0"; // End fully hidden
                    if (callback) callback();
                }
            }
            toggle();
        }

        // Listen for the "h" key press to trigger the effect
        document.addEventListener('keydown', (event) => {
            if (event.key === 'h' || event.key === 'H') {
                const panel = document.getElementById('help-panel');

                // Prevent multiple triggers while the panel is in the middle of flickering
                if (panel.dataset.flickering === "true") return;
                panel.dataset.flickering = "true";

                // Flicker in, then wait 5 seconds before flickering out
                flickerIn(panel, 80, 10, 0.7, () => {
                    setTimeout(() => {
                        flickerOut(panel, 100, 10, 0.8, () => {
                            panel.dataset.flickering = "false";
                        });
                    }, 5000); // 5 seconds visible after flickering in
                });
            }
        });
    </script>
</body>

</html>
