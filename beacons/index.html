        function createGallery() {
            const galleryContainer = document.createElement('div');
            galleryContainer.className = 'gallery';

            ordinalData.forEach(ordinal => {
                const galleryItem = document.createElement('div');
                galleryItem.className = 'gallery-item';

                const img = document.createElement('img');
                img.src = `beacons/previews/beacon${ordinal.number}.png`;
                img.alt = `Beacon #${ordinal.number}`;

                const link = document.createElement('a');
                link.href = `https://ordinals.com/content/${ordinal.id}`;
                link.target = '_blank';

                const caption = document.createElement('div');
                caption.className = 'gallery-caption';
                caption.textContent = `#${ordinal.number}`;

                galleryItem.appendChild(img);
                galleryItem.appendChild(link);
                galleryItem.appendChild(caption);
                galleryContainer.appendChild(galleryItem);
            });

            // Add gallery title
            const title = document.createElement('div');
            title.className = 'gallery-title';
            title.textContent = '-- all beacons discovered so far --';

            // Insert gallery after the button controls
            const buttonControls = document.querySelector('.button-controls');
            buttonControls.parentNode.insertBefore(title, buttonControls.nextSibling);
            buttonControls.parentNode.insertBefore(galleryContainer, title.nextSibling);
